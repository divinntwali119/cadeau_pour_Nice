{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors connexion — Église Smyrne</title>
  <link rel="icon" type="image/png" href="{% static 'images/pwa/favicon-32x32.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0f172a;
      --accent: #00c853;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    }

    .offline-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .offline-logo {
      width: 100px;
      height: 100px;
      border-radius: 1.2rem;
      margin: 0 auto 1.5rem;
      display: block;
      box-shadow: 0 8px 30px rgba(2, 132, 199, 0.4);
    }

    .wifi-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .verse {
      font-style: italic;
      font-size: 0.9rem;
      color: rgba(2, 132, 199, 0.9);
      margin: 1.5rem 0;
      padding: 1rem 1.5rem;
      border-left: 3px solid #0284c7;
      text-align: left;
      border-radius: 0 0.5rem 0.5rem 0;
      background: rgba(2, 132, 199, 0.08);
    }

    .verse cite {
      display: block;
      font-style: normal;
      font-weight: 600;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: rgba(2, 132, 199, 0.7);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-retry:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.9rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 500;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-home:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-dot.online {
      background: var(--accent);
      animation: none;
    }


    @media (max-width: 480px) {
      .offline-card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="offline-card">

    <img src="{% static 'images/logo_smyrne.jpeg' %}" alt="Logo Église Smyrne" class="offline-logo">

    <span class="wifi-icon">📶</span>

    <h1>Vous êtes hors connexion</h1>

    <p class="subtitle">
      Vérifiez votre connexion Internet et réessayez.
      Certaines pages déjà visitées sont disponibles hors ligne.
    </p>

    <blockquote class="verse">
      « Je suis le chemin, la vérité, et la vie. »
      <cite>— Jean 14:6</cite>
    </blockquote>

    <div class="actions">
      <button class="btn-retry" id="retry-btn" onclick="retryConnection()">
        🔄 Réessayer
      </button>
      <a href="/" class="btn-home">
        🏠 Accueil
      </a>
    </div>

    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Hors connexion</span>
    </div>

  </div>

  <script>
    // Vérifier la connexion au chargement
    function updateConnectionStatus() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Connexion rétablie — cliquez sur Réessayer';
      } else {
        dot.classList.remove('online');
        text.textContent = 'Hors connexion';
      }
    }

    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      btn.textContent = '⏳ Vérification...';
      btn.disabled = true;

      // Tenter de recharger
      setTimeout(() => {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          btn.textContent = '🔄 Réessayer';
          btn.disabled = false;
        }
      }, 1500);
    }

    // Écouter les changements de connexion
    window.addEventListener('online', () => {
      updateConnectionStatus();
      // Recharger automatiquement après 1 seconde
      setTimeout(() => window.location.reload(), 1000);
    });

    window.addEventListener('offline', updateConnectionStatus);

    // Vérifier au démarrage
    updateConnectionStatus();
  </script>

</body>
</html>
